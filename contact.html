<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - CUIMS Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navbar -->
  <header>
    <nav class="navbar">
      <div class="logo">
        <img src="cuimslogo.png" alt="CUIMS Logo">
        <span>CUIMS Portal</span>
      </div>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html" class="active">Contact</a>
      </div>
    </nav>
  </header>

  <!-- Contact Section -->
  <section class="hero">
    <h1>Contact Us</h1>
    <p>We’d love to hear from you</p>
  </section>

  <main style="padding:40px; max-width:700px; margin:auto;">
    <form class="contact-form">
      <label>Name</label>
      <input type="text" placeholder="Enter your name" required>
      
      <label>Email</label>
      <input type="email" placeholder="Enter your email" required>
      
      <label>Message</label>
      <textarea placeholder="Write your message..." rows="5" required></textarea>
      
      <button type="submit" class="btn">Send Message</button>
    </form>
  </main>

  <footer>
    <p>2025 Navjot Kaur | All Rights Reserved</p>
  </footer>
  <!-- Popup -->
<div id="popup" class="popup">
  <div class="popup-content">
    <p>🎉 Thank you! Your message has been submitted successfully.</p>
    <button onclick="closePopup()">OK</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
